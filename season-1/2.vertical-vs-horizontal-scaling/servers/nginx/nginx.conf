# Local nginx front for the five season-1 servers.
# Start: `pnpm nginx:local` from the repo root. Runs in the foreground, Ctrl+C stops it.
# The path prefix picks the backend and is stripped before proxying:
#   http://localhost:8080/fastify/products  ->  http://127.0.0.1:5003/products
# A backend that is not running answers 502. That is expected, phase 1 runs one server at a time.
# gzip is on here. nginx skips a response the backend already compressed (it has Content-Encoding).

# Brotli is not built into Homebrew nginx. Build the module once with `bash build-brotli.sh`.
# The path is relative to the prefix (run/), see the nginx:local script in the root package.json.
load_module ../modules/ngx_http_brotli_filter_module.so;

worker_processes auto;
worker_rlimit_nofile 60000;
error_log error.log;
pid nginx.pid;

events {
    worker_connections 30000;
}

http {
    log_format up '$remote_addr [$time_local] "$request" $status $upstream_addr $upstream_response_time';
    access_log access.log up;
    keepalive_timeout 65;

    # --- 10 SEC CACHE CONFIG ---
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=api_cache:50m max_size=500m inactive=60s use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri$http_accept_encoding";
    # Accept-Encoding add kiya taki gzip wala alag cache ho aur non-gzip wala alag

    # gzip on;
    # gzip_comp_level 1;
    # gzip_proxied any;
    # gzip_vary on;
    # gzip_types application/json text/plain text/css application/javascript;
    # gzip_min_length 1024;

    # brotli on;
    # brotli_comp_level 1;
    # brotli_types application/json text/plain text/css application/javascript;
    # brotli_min_length 1024;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    upstream node    { server 127.0.0.1:5001; keepalive 4096; keepalive_timeout 4s; }
    upstream express { server 127.0.0.1:5002; keepalive 4096; keepalive_timeout 4s; }
    upstream fastify { server 127.0.0.1:5003; server 192.168.1.27:5003 max_fails=0; keepalive 4096; keepalive_timeout 60s; }
    # upstream fastify { server 127.0.0.1:5003; keepalive 4096; keepalive_timeout 4s; }

    upstream nestjs  { server 127.0.0.1:5004; keepalive 4096; keepalive_timeout 4s; }
    upstream go      { server 127.0.0.1:5005; keepalive 4096; keepalive_timeout 4s; }

    server {
        listen 8080;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location = /node    { return 301 /node/; }
        location = /express { return 301 /express/; }
        location = /fastify { return 301 /fastify/; }
        location = /nestjs  { return 301 /nestjs/; }
        location = /go      { return 301 /go/; }

        location /node/    { 
            proxy_cache api_cache;
            proxy_cache_valid 200 15s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status; # HIT / MISS dekhega

            proxy_set_header X-Forwarded-Prefix /node;    
            proxy_pass http://node/; 
        }
        location /express/ { 
            proxy_cache api_cache;
            proxy_cache_valid 200 15s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_set_header X-Forwarded-Prefix /express; 
            proxy_pass http://express/; 
        }
        location /fastify/ { 
            # proxy_connect_timeout 1s;
            # proxy_cache api_cache;
            # proxy_cache_valid 200 15s;
            # proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            # proxy_cache_lock on;
            # add_header X-Cache-Status $upstream_cache_status;

            proxy_set_header X-Forwarded-Prefix /fastify; 
            proxy_pass http://fastify/; 
        }
        location /nestjs/  { 
            proxy_cache api_cache;
            proxy_cache_valid 200 15s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_set_header X-Forwarded-Prefix /nestjs;  
            proxy_pass http://nestjs/;
        }
        location /go/ {
            proxy_cache api_cache;
            proxy_cache_valid 200 15s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_set_header X-Forwarded-Prefix /go;
            proxy_pass http://go/;
        }

        location = / {
            default_type text/plain;
            return 200 "nginx local: /node/  /express/  /fastify/  /nestjs/  /go/\n";
        }
    }
}