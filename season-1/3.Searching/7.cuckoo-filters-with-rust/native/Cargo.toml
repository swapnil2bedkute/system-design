[package]
name = "cuckoo_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
fs2 = "0.4"
memmap2 = "0.9"
mongodb = { version = "3.9.1", features = ["sync"] }
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
redis = "1.7.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[build-dependencies]
napi-build = "2"
